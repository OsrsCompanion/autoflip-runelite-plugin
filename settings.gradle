pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            url = 'https://repo.runelite.net'
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal()
        maven {
            url = 'https://repo.runelite.net'
            content {
                includeGroupByRegex("net\\.runelite.*")
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'autoflip-runelite-plugin'